
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ../models/gguf:/models:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    command:
      - -m
      - /models/Qwen2.5-VL-3B-Instruct-GGUF/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
      - --mmproj
      - /models/Qwen2.5-VL-3B-Instruct-GGUF/mmproj-model-f16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - qwen2.5-vl-3b-q4_k_m
      - -ngl
      - "99"
      - -c
      - "32768"
      - --jinja
      - -ctk
      - q4_0
      - -ctv
      - q4_0
