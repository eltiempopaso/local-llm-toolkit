version = 1

[*]
n-gpu-layers = 99
flash-attn = true
jinja = true
models-max = 3

; Coding model
[qwen-coder]
model = /models/Qwen2.5-Coder-14B-Instruct-GGUF/qwen2.5-coder-14b-instruct-q4_k_m.gguf
ctx-size = 32768
cache-type-k = q4_0
cache-type-v = q4_0
n-gpu-layers = 99

; Autocomplete model
[qwen-autocomplete]
model = /models/Qwen2.5-Coder-1.5B-GGUF/Qwen2.5-Coder-1.5B-Q3_K_M.gguf
ctx-size = 1024
parallel = 1
n-gpu-layers = 99


; General chat model
[qwen-chat]
model = /models/Qwen3-14B-GGUF/Qwen3-14B-Q4_K_M.gguf
ctx-size = 32768
cache-type-k = q4_0
cache-type-v = q4_0
n-gpu-layers = 99

