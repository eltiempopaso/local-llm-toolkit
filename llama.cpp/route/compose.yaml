
services:
  llama-router:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-router

    ports:
      - "8080:8080"

    volumes:
      # GGUF compartidos con standalone
      - ../../models/gguf:/models:ro

      # Configuración del router
      - ./models-preset.ini:/config/models-preset.ini:ro

    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--models-preset"
      - "/config/models-preset.ini"
      - "--models-max"
      - "1"
      - "--models-memory-margin"
      - "1024"
      - "--sleep-idle-seconds"
      - "10"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped

    init: true

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
