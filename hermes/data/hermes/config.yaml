
model:
  provider: custom
  base_url: http://host.docker.internal:8080/v1
  default: gemma-chat
  api_key: ${HERMES_CUSTOM_127_0_0_1_8080_75A5BE96_API_KEY}
  supports_vision: true
  api_mode: chat_completions

providers:
  local:
    api: http://host.docker.internal:8080/v1
    key_env: HERMES_CUSTOM_127_0_0_1_8080_75A5BE96_API_KEY
    transport: chat_completions
    default_model: gemma-chat

_config_version: 54

agent:
  max_turns: 150
  reasoning_effort: medium

telemetry:
  shared_metrics:
    enabled: true
    send: true
    offer_version: 2

onboarding:
  seen:
    busy_input_prompt: true

mcp_servers:
  chess:
    url: http://host.docker.internal:8000/mcp
    enabled: true

gateway:
  multiplex_profiles: true
  service_install_choice: install

browser:
  cloud_provider: local

platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web

known_plugin_toolsets:
  cli:
    - a2a

known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search

web:
  search_backend: searxng
